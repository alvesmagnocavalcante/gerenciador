services:
  pyautomation:
    image: ghcr.io/alvesmagnocavalcante/gerenciador:latest
    container_name: pyautomation-manager
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PROJECT_NAME: "PyAutomation Manager"
      SECRET_KEY: ${SECRET_KEY:?defina SECRET_KEY no .env}
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD no .env}
      TIMEZONE: "America/Sao_Paulo"
      MAX_CONCURRENT_EXECUTIONS: "5"
      DEFAULT_TIMEOUT_SECONDS: "3600"
      RUN_SCHEDULER_IN_WEB: "true"
    volumes:
      - pyautomation_data:/app/data

volumes:
  pyautomation_data: