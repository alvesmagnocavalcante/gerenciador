{% extends "base.html" %}

{% block title %}Entrar - PyAutomation Manager{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex flex-col justify-center items-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-sky-100 dark:bg-sky-950/60 text-sky-600 dark:text-sky-400 text-3xl font-bold mb-3 shadow-sm">
            ⚡
        </div>
        <h2 class="text-3xl font-extrabold text-zinc-900 dark:text-white tracking-tight">PyAutomation</h2>
        <p class="mt-2 text-sm text-zinc-600 dark:text-zinc-400">Acesse o painel central de gerenciamento de automações</p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white dark:bg-zinc-900 py-8 px-6 shadow-sm border border-zinc-200 dark:border-zinc-800 sm:rounded-xl sm:px-10 transition-colors">
            {% if error %}
            <div class="mb-4 p-3 rounded-lg bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-sm">
                {{ error }}
            </div>
            {% endif %}

            <form class="space-y-5" action="/login" method="POST">
                <div>
                    <label for="username" class="block text-xs font-semibold text-zinc-700 dark:text-zinc-300 uppercase tracking-wider">Usuário</label>
                    <div class="mt-1">
                        <input id="username" name="username" type="text" required value="{{ username or 'admin' }}"
                            class="appearance-none block w-full px-3 py-2 border border-zinc-300 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white rounded-lg shadow-sm placeholder-zinc-400 focus:outline-none focus:ring-sky-500 focus:border-sky-500 sm:text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-xs font-semibold text-zinc-700 dark:text-zinc-300 uppercase tracking-wider">Senha</label>
                    <div class="mt-1">
                        <input id="password" name="password" type="password" required value="admin123"
                            class="appearance-none block w-full px-3 py-2 border border-zinc-300 dark:border-zinc-700 dark:bg-zinc-800 dark:text-white rounded-lg shadow-sm placeholder-zinc-400 focus:outline-none focus:ring-sky-500 focus:border-sky-500 sm:text-sm">
                    </div>
                </div>

                <div class="pt-2">
                    <button type="submit"
                        class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-sky-600 hover:bg-sky-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-sky-500 transition duration-150">
                        Entrar no Painel
                    </button>
                </div>
            </form>
            <div class="mt-6 text-center text-xs text-zinc-400 dark:text-zinc-500">
                Padrão inicial: <code class="bg-zinc-100 dark:bg-zinc-800 px-1 py-0.5 rounded text-zinc-600 dark:text-zinc-400">admin</code> / <code class="bg-zinc-100 dark:bg-zinc-800 px-1 py-0.5 rounded text-zinc-600 dark:text-zinc-400">admin123</code>
            </div>
        </div>
    </div>
</div>
{% endblock %}
