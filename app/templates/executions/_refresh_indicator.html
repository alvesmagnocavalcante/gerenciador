{% if execution.status in ['PENDING', 'RUNNING'] %}
<span class="inline-flex items-center text-xs text-blue-600 dark:text-blue-400 font-medium">
    <span class="w-2 h-2 rounded-full bg-blue-600 dark:bg-blue-400 mr-1.5 animate-ping"></span>
    Atualização em tempo real (1s)
</span>
{% elif execution.status == 'SUCCESS' %}
<span class="inline-flex items-center text-xs text-emerald-600 dark:text-emerald-400 font-medium">✓ Execução finalizada</span>
{% elif execution.status in ['FAILED', 'TIMEOUT'] %}
<span class="inline-flex items-center text-xs text-rose-600 dark:text-rose-400 font-medium">× Execução finalizada</span>
{% else %}
<span class="inline-flex items-center text-xs text-zinc-500 font-medium">Execução encerrada</span>
{% endif %}
